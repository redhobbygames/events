<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Hobby Games Events</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
  /* Black/red/white brand theme */
  :root {
    --bg:      #111111;
    --bg2:     #1c1c1c;
    --fg:      #ffffff;
    --fg2:     #aaaaaa;
    --border:  #2e2e2e;
    --red:     #e02020;
    --red2:    #ff3030;
    --card-hover: #222222;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }

  /* ── Header ── */
  .site-header {
    background: #000000;
    margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    padding: 36px max(24px, env(safe-area-inset-left, 0px)) 28px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .rhg-logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 16px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    /* no filter — logo uses its original colours */
  }

  .site-title {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.02em;
    line-height: 1.1;
    text-wrap: balance;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .site-title .red { color: var(--red2); }

  .site-subtitle {
    font-size: 13px;
    color: var(--fg2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* Social bar */
  .social-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .social-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #1e1e1e;
    border: 1px solid #333;
    color: #cccccc;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .social-link:hover { background: #2a2a2a; color: #fff; border-color: #555; }

  .social-link.shop {
    background: #1a0000;
    border-color: #7a0000;
    color: var(--red2);
  }

  .social-link.shop:hover { background: #2a0000; border-color: var(--red); }

  /* ── Main ── */
  .main-content {
    max-width: 640px;
    margin: 0 auto;
    padding-top: 28px;
    padding-bottom: 48px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg2);
    margin-bottom: 12px;
  }

  /* ── Event Cards ── */
  .events-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .event-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--fg);
    transition: background 0.15s, border-color 0.15s;
    cursor: pointer;
  }

  .event-card:hover {
    background: var(--card-hover);
    border-color: var(--red);
  }

  .event-icon {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: #0a0a0a;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .event-info { flex: 1; min-width: 0; }

  .event-name {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 2px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .event-meta {
    font-size: 12px;
    color: var(--fg2);
  }

  .event-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #0a1a0a;
    border: 1px solid #1a5a1a;
    color: #4ec94e;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #4ec94e;
  }

  .event-arrow {
    color: #444;
    font-size: 20px;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }

  .event-card:hover .event-arrow {
    color: var(--red);
    transform: translateX(3px);
  }

  /* ── Footer ── */
  .page-footer {
    text-align: center;
    padding: 16px 0 8px;
    font-size: 12px;
    color: #555;
    border-top: 1px solid var(--border);
    margin-top: 32px;
  }

  .page-footer a { color: #555; text-decoration: none; }
  .page-footer a:hover { color: var(--red2); }
</style>
</head>
